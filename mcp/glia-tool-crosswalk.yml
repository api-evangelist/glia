surfaces:
  openapi:
    present: false
    note: >-
      Glia publishes no public OpenAPI. The developer reference at docs.glia.com is served by a
      Fern site behind a Glia account login (302 to app.glia.com/login), and /openapi.json on that
      host returns 401. api.glia.com returns 404 for /openapi.json, /openapi.yaml, /swagger.json,
      /api-docs, /docs and /redoc. Because there is no spec, the rest[] column below binds tools
      to observed METHOD + PATH rather than to operationIds.
  graphql:
    present: false
    note: POST https://api.glia.com/graphql returns 404 Route Not Found.
  mcp:
    url: null
    transport: stdio
    gated: true
    note: >-
      stdio-only, launched locally as `glia-functions mcp`; there is no remote endpoint to call
      tools/list against anonymously, so tool inputs were read from source.
  rest:
    base_url: https://api.glia.com
    regional: [https://api.glia.eu]
    accept: application/vnd.salemove.v1+json
