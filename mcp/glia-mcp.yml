server:
  name: glia-functions-cli
  version: 0.1.0
  transport: stdio
  url: null
  hosted: false
  sdk: '@modelcontextprotocol/sdk'
  launch: glia-functions mcp
  repository: https://github.com/salemove/glia-functions-tools
  license: MIT
  scope: Glia Functions only - functions, versions, deployments, logs, environment variables, the KV store
    and scheduled triggers. There is no MCP surface over engagements, queues, operators or the rest of
    the Glia platform REST API.
  auth:
    style: env
    variables:
    - GLIA_KEY_ID
    - GLIA_KEY_SECRET
    - GLIA_SITE_ID
    note: The server mints a platform bearer token from the key pair at POST https://api.glia.com/operator_authentication/tokens;
      there is no OAuth surface and no remote/HTTP MCP endpoint to introspect anonymously.
