notes: >-
  Glia ships first-party mobile SDKs to Maven Central under the com.glia group and to CocoaPods
  under the Glia* pod names. There is no first-party npm package for the browser SDK - the
  Visitor JS SDK is loaded from a script served by the Glia platform rather than installed from
  a registry - and no first-party PyPI, NuGet, Go, RubyGems, Packagist or crates.io client.
