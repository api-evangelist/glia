apis:
- aid: glia:glia-rest-api
  name: Glia REST API
  description: 'The Glia platform REST API. Serves operators, sites, engagements, queues and
    reporting resources over api.glia.com (US) and api.glia.eu (EU). Authentication is a bearer
    token minted from an API key id/secret pair at /operator_authentication/tokens; requests
    negotiate a version through the Accept header (application/vnd.salemove.v1+json). Reference
    documentation is behind a Glia account login, so no OpenAPI is published publicly.'
  humanURL: https://docs.glia.com/glia-dev
  baseURL: https://api.glia.com
  tags:
  - Customer Service
  - Engagements
  - Contact Center
  properties:
  - type: Authentication
    url: authentication/glia-authentication.yml
  - type: ErrorCatalog
    url: errors/glia-error-codes.yml
  - type: Conventions
    url: conventions/glia-conventions.yml
- aid: glia:glia-functions-api
  name: Glia Functions API
  description: 'Glia Functions is a serverless JavaScript runtime (workerd) inside the Glia
    platform, with REST endpoints for functions, versions, deployments, logs, applets, a KV store
    and cron-style scheduled triggers. Glia publishes a first-party CLI and a stdio MCP server
    exposing 23 tools over these operations.'
  humanURL: https://github.com/salemove/glia-functions-tools
  baseURL: https://api.glia.com
  tags:
  - Serverless
  - Functions
  - Developer Tools
  properties:
  - type: MCPServer
    url: mcp/glia-mcp.yml
  - type: ToolCrosswalk
    url: mcp/glia-tool-crosswalk.yml
  - type: CLI
    url: cli/glia-cli.yml
  - type: SourceCode
    url: https://github.com/salemove/glia-functions-tools
- aid: glia:glia-visitor-js-sdk
  name: Glia Visitor JS SDK
  description: 'The public browser SDK for embedding Glia engagements into a web property -
    queueing for engagement, chat, media upgrades, screen sharing, CoBrowsing, visitor
    authentication, surveys and message center. Its API reference is published openly at
    sdk-docs.glia.com with 59 documented classes.'
  humanURL: https://sdk-docs.glia.com/visitor-js-api/current/
  baseURL: https://api.glia.com
  tags:
  - JavaScript
  - SDK
  - CoBrowsing
  properties:
  - type: APIReference
    url: https://sdk-docs.glia.com/visitor-js-api/current/
