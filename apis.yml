aid: glia
name: Glia
description: 'Glia (formerly SaleMove) is a digital customer service and applied-AI platform
  built for banks, credit unions and insurers, unifying chat, voice, video, messaging and
  CoBrowsing under what the company calls ChannelLess architecture. Its AI layer is packaged as
  Glia Banker (customer-facing AI agent), Glia CoPilot (real-time agent assist) and Glia Analyst
  (manager/QA AI), alongside Glia Voice. The developer surface is a REST API at api.glia.com with
  regional US/EU hosts, a public Visitor JS SDK for embedding engagements in web properties,
  native iOS/Android/Ionic widget SDKs published to CocoaPods and Maven Central, and Glia
  Functions - a workerd-based serverless JavaScript runtime with a first-party CLI and MCP server.
  Developer documentation is served from a Fern-hosted portal that requires a Glia account login,
  so no public OpenAPI is published.'
